services:
  db:
    image: postgres:16
    container_name: scientia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: scientia
      POSTGRES_USER: scientia
      POSTGRES_PASSWORD: scientia
      TZ: America/Recife
    ports:
      - "5432:5432"
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - scientia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scientia -d scientia"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  scientia_pgdata:
